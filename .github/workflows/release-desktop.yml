name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Link the SDK into the ejected build
        run: |
          mkdir -p .native
          ln -s "$PWD/node_modules/@native-sdk/cli" .native/sdk
          node -e 'const fs = require("fs"); const path = "build.zig.zon"; fs.writeFileSync(path, fs.readFileSync(path, "utf8").replace(/\.path = "[^"]+"/, `.path = ".native/sdk"`));'

      - name: Check and build
        run: |
          npx native check .
          npx native build . --yes

      - name: Package disk image
        run: |
          npx native package --target macos --binary zig-out/bin/sarvam-ai-widget --output dist/Sarvam-AI-Widget.app --signing adhoc --archive
          mv dist/sarvam-ai-widget-0.1.0-macos-ReleaseFast.dmg dist/Sarvam-AI-Widget-${{ matrix.arch }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Sarvam-AI-Widget-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.dmg
